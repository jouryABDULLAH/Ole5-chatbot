[project]
name = "ole5-chat"
version = "0.1.0"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.evalkit]
# evals = "evals"                  # folder with task.py and datasets/<suite>.json
# prefix = "Ole5-chatbot"          # Phoenix dataset and prompt names (default: [project] name, else the folder)
# model = "openai/gpt-oss-120b"    # Groq model for error analysis, entry detection and the judges
# graders = ["correctness", "tools_called"]   # every suite's graders (these are the default)
# snapshots = ".evalkit"           # where snapshots are stored
# commit_snapshots = false         # true: commit snapshots to share them
# tracing = true                   # false: the project sends its own traces to Phoenix
# detect_with_llm = true           # false: entry detection without the LLM review
entry = "src/ole5_chat/agent/graph.py"
roots = ["src"]

[tool.evalkit.suites.answerable]
graders = ["evals.graders:correctness", "evals.graders:completeness", "evals.graders:phase_matches", "evals.graders:language_matches", "evals.graders:sources_match", "evals.graders:draft_matches"]

[tool.evalkit.suites.unanswerable]
graders = ["evals.graders:correctness", "evals.graders:phase_matches", "evals.graders:language_matches", "evals.graders:sources_match", "evals.graders:draft_matches"]

[tool.evalkit.suites.conversations]
graders = ["evals.graders:correctness", "evals.graders:completeness", "evals.graders:phase_matches", "evals.graders:language_matches", "evals.graders:sources_match", "evals.graders:draft_matches"]

[tool.evalkit.suites.answerable_small]
graders = ["evals.graders:correctness", "evals.graders:completeness", "evals.graders:phase_matches", "evals.graders:language_matches", "evals.graders:sources_match", "evals.graders:draft_matches"]

[tool.evalkit.suites.happy_path]
graders = ["evals.graders:correctness", "evals.graders:completeness", "evals.graders:phase_matches", "evals.graders:language_matches", "evals.graders:sources_match", "evals.graders:draft_matches"]

[tool.evalkit.suites.reg_kb_answers]
task = "evals.regression_task:agent_task"
graders = ["evals.regression_graders:search_answered", "evals.regression_graders:answer_retrieved", "evals.regression_graders:chunk_included", "evals.graders:completeness", "evals.regression_graders:grounded"]

# The 8 truly failing reg_kb_answers cases of 2026-11-09 (docs/search_eval.md), to rerun quickly after a fix.
[tool.evalkit.suites.reg_kb_failing]
task = "evals.regression_task:agent_task"
graders = ["evals.regression_graders:search_answered", "evals.regression_graders:answer_retrieved", "evals.regression_graders:chunk_included", "evals.graders:completeness", "evals.regression_graders:grounded"]

[tool.evalkit.suites.reg_direct_chunks]
task = "evals.regression_task:direct_chunks_task"
graders = ["evals.regression_graders:provided_answer", "evals.regression_graders:no_ticket_offer", "evals.regression_graders:required_text", "evals.regression_graders:grounded"]

[tool.evalkit.suites.reg_respond]
task = "evals.regression_task:respond_task"
graders = ["evals.regression_graders:no_ticket_offer", "evals.regression_graders:question_count", "evals.regression_graders:required_text", "evals.graders:language_matches"]

[tool.evalkit.suites.reg_flows]
task = "evals.regression_task:flow_task"
graders = ["evals.regression_graders:pending_matches", "evals.regression_graders:counts_match", "evals.regression_graders:no_fallback", "evals.graders:language_matches"]
timeout = 900

# Conversations from docs/11_nov_bugs_last.md, replayed with the real Search: route, state and records per turn.
[tool.evalkit.suites.reg_conversations]
task = "evals.regression_task:conversation_task"
graders = ["evals.regression_graders:nodes_match", "evals.regression_graders:facts_match", "evals.regression_graders:records_match", "evals.regression_graders:pending_matches", "evals.regression_graders:counts_match", "evals.regression_graders:required_text"]
timeout = 900

[tool.evalkit.suites.reg_guards]
task = "evals.regression_task:guard_task"
graders = ["evals.regression_graders:guard_outcome", "evals.regression_graders:required_text"]
